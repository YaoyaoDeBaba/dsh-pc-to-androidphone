plugins {
    id 'com.android.application'
}

// 版本号由 CI 传进来：-PversionCode=<构建序号>
// 手机端拿 versionCode 跟最新 Release 的 build-N 比较，判断要不要提示更新
def vc = (project.findProperty("versionCode") ?: "1").toString().toInteger()
def vn = (project.findProperty("versionName") ?: "1.0.${vc}").toString()

android {
    namespace 'com.dsh.remote'
    compileSdk 34

    defaultConfig {
        applicationId "com.dsh.remote"
        minSdk 24
        targetSdk 34
        versionCode vc
        versionName vn
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 纯 WebView 外壳，零第三方依赖（不引 androidx，构建更稳、更快）
dependencies {
}
