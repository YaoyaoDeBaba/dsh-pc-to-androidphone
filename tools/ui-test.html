<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>UI 自测</title>
<!--
  手机端界面的无头自测：拿真实的 index.html + app.js，把 WebSocket 换成假的，
  然后直接往 applyEvent() 里灌协议帧，看 DOM 有没有按预期变。
  跑法见 tools/ui-test.ps1。
-->
<style>
  body{background:#12121a;color:#ddd;font:13px monospace;padding:10px}
  #head{display:flex;gap:6px;align-items:center}
  #res div{padding:2px 0}
  .ok{color:#3ecf8e}.bad{color:#ff6b6b}
</style>
</head>
<body>
<!-- 被测界面需要的骨架：直接从正式页面抄过来（id 必须一致） -->
<div id="head">
  <button id="backBtn" hidden>‹</button>
  <span class="fish">🐟</span>
  <span id="title">大肥鱼远控</span>
  <button id="renameBtn" class="ghost" hidden>✏️</button>
  <button id="modelBtn" class="ghost" hidden>模型</button>
  <span id="status">测试中…</span>
  <button id="reconnectBtn" hidden>重连</button>
  <button id="gearBtn" class="ghost" title="菜单">⚙️</button>
</div>

<div id="menuWrap" hidden>
  <div class="sheet menu">
    <div class="dlgT">菜单<span class="sp"></span><button id="menuClose" class="ghost">关闭</button></div>
    <button id="updateBtn" class="mrow">🔄 检查更新</button>
    <button id="logToggleBtn" class="mrow">📜 日志</button>
    <button id="repairBtn" class="mrow danger">⚠️ 重新配对</button>
  </div>
</div>

<div id="confirmWrap" hidden>
  <div class="dlg">
    <div class="dlgT" id="cfTitle">确定吗？</div>
    <p id="cfText" class="muted"></p>
    <div class="btns">
      <button id="cfOk" disabled>要等 5 秒</button>
      <button id="cfCancel" class="ghost">取消</button>
    </div>
  </div>
</div>

<div id="pairView" hidden>
  <input id="pairCode"><button id="connectBtn">连</button>
  <input id="relayUrl"><button id="saveRelayBtn">存</button>
</div>

<div id="listView">
  <div class="card"><h2>会话 <button id="refreshBtn">刷新</button><button id="updateBtn">更新</button><button id="repairBtn">重配</button></h2>
    <div id="sessions"></div>
  </div>
</div>

<div id="chatView" hidden>
  <div id="runBanner" hidden><span class="pulse"></span><span id="runText">深度求索中…</span></div>
  <div id="earlierWrap" hidden><button id="earlierBtn">加载更早</button></div>
  <div class="card" id="messages"></div>
  <footer id="composer" hidden>
    <input id="msgInput"><button id="sendBtn">发</button><button id="stopBtn">停</button>
  </footer>
</div>

<div class="card" id="logCard" hidden><button id="clearLog">清空</button><pre id="log"></pre></div>
<div id="main"></div>

<!-- 悬浮大肥鱼（占位形象）的骨架 -->
<button id="subFab" hidden>🐝<span id="subCount" hidden></span></button>
<div id="subPanel" hidden><div class="subHead"><span>子代理监视器</span><span><button id="subArchiveIdle" hidden>一键归档</button><button id="subClose">关闭</button></span></div><div id="subList"></div></div>
<div id="fishFab" hidden><div id="fishBubble" hidden></div><div id="fishBody"><div id="fishSprite" hidden></div><img id="fishImg" hidden alt=""><svg class="fishSvg" viewBox="0 0 64 64"></svg></div></div>

<div id="dlgWrap" hidden>
  <div class="dlg">
    <div class="dlgT" id="dlgTitle">会话名称</div>
    <input id="dlgInput" maxlength="80">
    <div><button id="dlgOk">确定</button><button id="dlgCancel" class="ghost">取消</button></div>
  </div>
</div>

<div id="modelWrap" hidden>
  <div class="sheet">
    <div class="dlgT">模型<span class="sp"></span><button id="modelRefresh" class="ghost">刷新</button><button id="modelClose" class="ghost">关闭</button></div>
    <div id="modelList"></div>
  </div>
</div>

<div id="res"></div>

<script>
  // ---- 假 WebSocket：客户端连不上不影响渲染逻辑 ----
  window.WebSocket = class {
    constructor() { this.readyState = 0; this.sent = [] }
    send(x) { this.sent.push(x) }
    close() { this.readyState = 3 }
    addEventListener() {}
    removeEventListener() {}
  }
  window.__WS_SENT = []
  // ---- 假 localStorage：file:// 下访问真 localStorage 会抛 SecurityError，
  //      而 app.js 顶部就用了它，所以必须在它之前换掉 ----
  const mem = {}
  try {
    Object.defineProperty(window, 'localStorage', {
      configurable: true,
      value: {
        getItem: (k) => (k in mem ? mem[k] : null),
        setItem: (k, v) => { mem[k] = String(v) },
        removeItem: (k) => { delete mem[k] },
      },
    })
  } catch (e) { document.title = 'FAIL storage-shim' }
  const errs = []
  window.addEventListener('error', (e) => { errs.push(String(e.message || e.error || 'err')) })
</script>
<script src="../app/src/main/assets/app.js" onerror="window.__loadFail = true"></script>
<script>
  const out = []
  function check(name, cond, extra) {
    out.push({ name, pass: !!cond, extra: extra || '' })
  }
  function dump() {
    const res = document.getElementById('res')
    for (const r of out) {
      const d = document.createElement('div')
      d.className = r.pass ? 'ok' : 'bad'
      d.textContent = (r.pass ? 'PASS ' : 'FAIL ') + r.name + (r.extra ? '  [' + r.extra + ']' : '')
      res.appendChild(d)
    }
  }
  function textOf(id) { const e = document.getElementById(id); return e ? e.textContent : '' }

  window.addEventListener('load', () => {
    setTimeout(() => {
      const D = window.__drc
      if (!D) {
        const res = document.getElementById('res')
        const d = document.createElement('div')
        d.className = 'bad'
        d.textContent = 'FAIL no-hook  loadFail=' + String(window.__loadFail) + '  errs=' + JSON.stringify(errs).slice(0, 300)
        res.appendChild(d)
        document.title = 'FAIL no-hook'
        return
      }

      // ---- 1. 会话列表：工作区 "＋ 新会话"、空的 fresh 会话不藏 ----
      D.S.sessions = [
        { id: 'a1', title: '会话A', workspace: 'D:\\proj\\alpha', state: 'idle' },
        { id: 'a2', title: '会话B', workspace: 'D:\\proj\\alpha', state: 'running' },
        { id: 'n1', title: '', workspace: 'D:\\proj\\beta' },
      ]
      D.S.fresh = { n1: true }
      D.renderSessions()
      const html = document.getElementById('sessions').innerHTML
      check('列表有工作区', html.includes('alpha'))
      check('工作区有 ＋ 新会话', html.includes('＋ 新会话'))
      check('fresh 空会话保留并显示「新会话」', html.includes('新会话'))
      const addBtns = document.querySelectorAll('.wsAdd')
      check('每个工作区一个按钮', addBtns.length === 2, 'count=' + addBtns.length)

      // ---- 2. 进会话：顶部出现改名/模型按钮 ----
      D.openSession('a1', '会话A')
      check('chat 视图显示改名按钮', !document.getElementById('renameBtn').hidden)
      check('chat 视图显示模型按钮', !document.getElementById('modelBtn').hidden)
      check('顶部标题=会话A', textOf('title') === '会话A', textOf('title'))

      // ---- 3. 模型清单回执 → 面板渲染 ----
      D.applyEvent({
        t: 'ev.result', ok: true, cmdId: 'x',
        data: {
          kind: 'catalog',
          catalog: {
            groups: [{
              id: 'deepseek', name: 'DeepSeek',
              models: [
                { id: 'deepseek-chat', name: 'Chat', efforts: [{ id: 'low', name: '低' }, { id: 'high', name: '高' }], defaultEffort: 'low' },
                { id: 'deepseek-reasoner', name: 'Reasoner' },
              ]
            }],
            failures: []
          }
        }
      })
      const ml = document.getElementById('modelList').innerHTML
      check('面板列出 provider', ml.includes('DeepSeek'))
      check('面板列出模型', ml.includes('Chat') && ml.includes('Reasoner'))
      check('有档位的模型标「可调档」', ml.includes('可调档'))

      // ---- 4. 选模型回执 → 徽标 + 高亮 + 档位展开 ----
      D.applyEvent({ t: 'ev.result', ok: true, cmdId: 'y', data: { kind: 'model', sessionId: 'a1', selected: { provider: 'deepseek', model: 'deepseek-chat', reasoningEffort: 'high' } } })
      check('模型徽标=deepseek-chat', textOf('modelBtn') === 'deepseek-chat', textOf('modelBtn'))
      const ml2 = document.getElementById('modelList').innerHTML
      check('选中项高亮', ml2.includes('mitem on'))
      check('展开努力程度档位', ml2.includes('低') && ml2.includes('高'))
      check('当前档位高亮', /class="on">高/.test(ml2))

      // ---- 5. ev.model 广播 → 徽标跟着变（手机没选过时兜底） ----
      D.S.modelOf = {}
      D.applyEvent({ t: 'ev.model', sessionId: 'a1', model: 'deepseek-reasoner', provider: 'deepseek', canSwitch: false })
      check('广播模型生效', textOf('modelBtn') === 'deepseek-reasoner', textOf('modelBtn'))

      // ---- 6. 改名回执 → 顶部标题变 ----
      D.applyEvent({ t: 'ev.result', ok: true, cmdId: 'z', data: { kind: 'title', sessionId: 'a1', title: '改好的名字' } })
      check('改名后标题更新', textOf('title') === '改好的名字', textOf('title'))

      // ---- 7. 新建会话回执 → 自动进入新会话 ----
      D.applyEvent({ t: 'ev.result', ok: true, cmdId: 'w', data: { sessionId: 'new-1' } })
      check('新建后进入新会话', D.S.current === 'new-1', D.S.current)
      check('新会话标题=新会话', textOf('title') === '新会话', textOf('title'))
      check('新会话进 fresh 白名单', D.S.fresh['new-1'] === true)

      // ---- 8. 失败回执（补丁没生效）→ 给可操作提示 ----
      D.S.cmdNames = { bad1: 'rename' }
      D.applyEvent({ t: 'ev.result', ok: false, cmdId: 'bad1', message: '主机这一代不支持「cmd.rename_session」' })
      check('失败提示可操作', textOf('status').includes('重启 DSH'), textOf('status'))

      // ---- 9. 取清单失败 → 面板写明原因 ----
      D.S.catalog = null
      D.S.cmdNames = { bad2: 'models' }
      D.applyEvent({ t: 'ev.result', ok: false, cmdId: 'bad2', message: '没有 modelCatalog' })
      check('面板显示失败原因', document.getElementById('modelList').innerHTML.includes('取不到清单'), document.getElementById('modelList').textContent.trim())

      // ---- 10. 新建会话：正在建的时候按钮变「建中…」且不能点 ----
      D.S.newBusy = true
      D.renderSessions()
      const busyBtn = document.querySelector('.wsAdd')
      check('建中按钮文案', busyBtn && busyBtn.textContent === '建中…', busyBtn && busyBtn.textContent)
      check('建中按钮禁用', busyBtn && busyBtn.disabled === true, String(busyBtn && busyBtn.disabled))
      D.S.newBusy = false

      // ---- 11. 新建会话：同工作区已有空会话就进去，不重复建 ----
      D.S.sessions = [
        { id: 'e1', title: '', workspace: 'D:\\proj\\gamma' },
        { id: 't1', title: '有标题的', workspace: 'D:\\proj\\gamma' },
      ]
      D.S.fresh = { e1: true }
      D.S.current = null
      D.S.msgs = []
      D.renderSessions()
      check('找到同工作区空会话', D.findEmptySession('D:\\proj\\gamma') === 'e1', String(D.findEmptySession('D:\\proj\\gamma')))
      check('有标题的不算空会话', D.findEmptySession('D:\\proj\\gamma') !== 't1')
      const btns2 = document.querySelectorAll('.wsAdd')
      // 让 cmdNewSession 过掉「没配对」守卫；openSession 会发两条帧，所以把加密和 socket 也备好
      D.S.kC2H = new Uint8Array(32)
      D.S.noncePre = new Uint8Array(16)
      D.S.outSeq = 1
      D.S.ws = { readyState: 1, send: (x) => window.__WS_SENT.push(x), close() {} }
      btns2[btns2.length - 1].click()
      check('点＋直接进空会话', D.S.current === 'e1', String(D.S.current))
      check('没有进入新建等待态', D.S.newBusy === false, String(D.S.newBusy))

      // ---- 12. 顶部按钮：只剩齿轮，更新/日志/重新配对都收进菜单 ----
      const headerBtns = [...document.querySelectorAll('#head button')].map(b => b.id)
      check('顶部有齿轮', headerBtns.includes('gearBtn'), headerBtns.join(','))
      check('顶部没有更新按钮', !headerBtns.includes('updateBtn'), headerBtns.join(','))
      check('顶部没有日志按钮', !headerBtns.includes('logToggleBtn'), headerBtns.join(','))
      check('顶部没有重新配对', !headerBtns.includes('repairBtn'), headerBtns.join(','))

      // ---- 12b. 点齿轮开菜单，三个动作都在里面 ----
      D.el.gearBtn.click()
      check('齿轮打开菜单', document.getElementById('menuWrap').hidden === false)
      const menuIds = [...document.querySelectorAll('#menuWrap button')].map(b => b.id)
      check('菜单里有更新/日志/重新配对', ['updateBtn', 'logToggleBtn', 'repairBtn'].every(k => menuIds.includes(k)), menuIds.join(','))

      // ---- 12c. 点「重新配对」先弹确认框，确认键先禁用并倒计时 ----
      D.el.repairBtn.click()
      check('弹确认框', document.getElementById('confirmWrap').hidden === false)
      check('菜单自动收起', document.getElementById('menuWrap').hidden === true)
      const cfOk = document.getElementById('cfOk')
      check('确认键先禁用', cfOk.disabled === true)
      check('确认键显示倒计时', /要等 \d 秒/.test(cfOk.textContent), cfOk.textContent)

      // ---- 12d. 取消后什么都不发生 ----
      const viewBefore = D.S.view
      D.el.cfCancel.click()
      check('取消关掉确认框', document.getElementById('confirmWrap').hidden === true)
      check('取消后页面没变', D.S.view === viewBefore, String(D.S.view))

      // ---- 13. 连点留下的多个空会话：同工作区只显示一个 ----
      D.S.current = null
      D.S.sessions = [
        { id: 'k1', title: '', workspace: 'D:\\proj\\delta' },
        { id: 'k2', title: '', workspace: 'D:\\proj\\delta' },
        { id: 'k3', title: '', workspace: 'D:\\proj\\delta' },
      ]
      D.S.fresh = { k1: true, k2: true, k3: true }
      D.renderSessions()
      const shown = [...document.querySelectorAll('#sessions *')].filter(e => e.textContent === '新会话').length
      check('三个空会话只显示一条', shown === 1, 'shown=' + shown)

      // ---- 14. 断线重连：开着的会话不能被踢回列表（原来是 showView('list')） ----
      D.S.sessions = [{ id: 'a1', title: '会话A', workspace: 'D:\\proj\\alpha' }]
      D.S.current = 'a1'
      D.S.currentTitle = '会话A'
      D.S.mode = 'resume'
      D.S.pskBytes = new Uint8Array(32).fill(7)
      D.S.convId = 'conv-test'
      D.S.clientId = 'cl-test'
      D.S.ws = { readyState: 1, send: (x) => window.__WS_SENT.push(x), close() {} }
      window.__WS_SENT = []
      D.showView('chat')
      D.handleFrame({ t: 'hello-ok' })
      check('重连后仍在会话页', document.getElementById('chatView').hidden === false)
      check('重连保留当前会话', D.S.current === 'a1', String(D.S.current))
      check('重连补拉历史+未决', window.__WS_SENT.length >= 2, 'sent=' + window.__WS_SENT.length)

      // ---- 15. 页面重载/App 重进：恢复到上次开着的会话 ----
      D.S.current = null
      D.S.mode = 'resume'
      D.S.historyLoaded = false
      localStorage.setItem('drc.open', JSON.stringify({ id: 'a1', title: '会话A' }))
      D.showView('list')
      window.__WS_SENT = []
      D.handleFrame({ t: 'hello-ok' })
      check('重载后回到原会话', D.S.current === 'a1', String(D.S.current))
      check('重载后是会话页', document.getElementById('chatView').hidden === false)

      // ---- 16. 从会话返回列表：要清掉"上次打开"的记忆 ----
      D.goBack()
      check('返回列表清掉记忆', localStorage.getItem('drc.open') === null, String(localStorage.getItem('drc.open')))

      // ---- 16b. 看图：路径变按钮 → 点了分块取图 → 贴出来；失败给人话 ----
      void (async () => {
        try {
          const ps = D.findImagePaths('效果图 `E:\\MonSlayer\\Assets\\vfx 1.png` 以及 E:\\a\\b.jpg。')
          check('认得反引号里带空格的路径', ps[0] === 'E:\\MonSlayer\\Assets\\vfx 1.png', JSON.stringify(ps))
          check('裸路径也认得', ps.indexOf('E:\\a\\b.jpg') >= 0, JSON.stringify(ps))
          check('非图片扩展名不认', D.findImagePaths('E:\\a\\b.txt').length === 0)

          D.openSession('a1', '会话A')
          D.S.msgs = []
          D.applyEvent({ t: 'ev.message_delta', sessionId: 'a1', messageId: 'm_img1', role: 'assistant', delta: '做好了，预览在这：E:\\MonSlayer\\Preview.png' })
          await new Promise((r) => setTimeout(r, 80))
          const chips = [...document.querySelectorAll('.imgchip')]
          check('消息里出现看图的按钮', chips.length === 1, 'count=' + chips.length)
          check('按钮上写了文件名', !!chips[0] && chips[0].textContent.indexOf('Preview.png') >= 0, chips[0] ? chips[0].textContent : '')

          const bytes = new Uint8Array([0x89, 0x50, 0x4e, 0x47, 1, 2, 3, 4])
          const enc = (u8) => btoa(String.fromCharCode.apply(null, Array.from(u8)))
          const half = 4
          const frames = [
            { ok: true, data: { kind: 'image', name: 'Preview.png', mime: 'image/png', size: bytes.length, offset: 0, next: half, data: enc(bytes.subarray(0, half)) } },
            { ok: true, data: { kind: 'image', name: 'Preview.png', mime: 'image/png', size: bytes.length, offset: half, data: enc(bytes.subarray(half)) } },
          ]
          const asked = []
          const fakeAsk = async (payload) => {
            asked.push(payload.offset)
            return frames[asked.length - 1]
          }
          await D.loadImage('E:\\MonSlayer\\Preview.png', chips[0], fakeAsk)
          check('按 next 连要两块', asked.length === 2 && asked[0] === undefined && asked[1] === half, JSON.stringify(asked))
          check('图片贴进气泡', document.querySelectorAll('.msgimg').length === 1, 'count=' + document.querySelectorAll('.msgimg').length)
          check('取到后按钮消失', document.querySelectorAll('.imgchip').length === 0)

          D.S.msgs = []
          D.applyEvent({ t: 'ev.message_delta', sessionId: 'a1', messageId: 'm_img2', role: 'assistant', delta: '这张 E:\\nope.png 你试试' })
          D.renderMessages()
          await new Promise((r) => setTimeout(r, 80))
          const chip2 = document.querySelector('.imgchip')
          const badAsk = async () => ({ ok: false, message: '主机上找不到这个文件：nope.png' })
          await D.loadImage('E:\\nope.png', chip2, badAsk)
          check('失败时按钮还在', document.querySelectorAll('.imgchip').length === 1)
          check('失败原因写在状态栏', textOf('status').indexOf('找不到') >= 0, textOf('status'))
          const chipText = document.querySelector('.imgchip') ? document.querySelector('.imgchip').textContent : ''
          check('失败原因也留在按钮上（状态栏会被运行态覆盖）', chipText.indexOf('⚠️') >= 0 && chipText.indexOf('找不到') >= 0, chipText)
          // 空 delta（只收尾的帧）不许建空气泡
          D.S.msgs = []
          D.applyEvent({ t: 'ev.message_delta', sessionId: 'a1', messageId: 'm_empty1', role: 'assistant', delta: '', done: true })
          D.renderMessages()
          const nEmpty = document.querySelectorAll('#messages .msg').length
          check('空 delta 不建空气泡', nEmpty === 0, 'count=' + nEmpty)
          D.applyEvent({ t: 'ev.message_delta', sessionId: 'a1', messageId: 'm_ok1', role: 'assistant', delta: '正常正文' })
          D.renderMessages()
          const nOk = document.querySelectorAll('#messages .msg').length
          check('正常 delta 照旧建气泡', nOk === 1, 'count=' + nOk)
        } catch (e) {
          check('看图自测本身没抛异常', false, String(e && e.message ? e.message : e))
        }
      })()
      // ---- 18. 悬浮大肥鱼（占位形象）：配对后出现，跑活时晃，点一下冒气泡 ----
      // 用独立会话 id，别动异步看图自测正在用的 a1 消息列表
      D.S.current = 'fish-1'
      D.S.currentTitle = '悬浮测试'
      D.S.paired = false
      D.showView('chat')
      check('没配对时不显示悬浮小人', document.getElementById('fishFab').hidden === true)
      D.S.paired = true
      D.S.running = {}
      D.showView('chat')
      const fab = document.getElementById('fishFab')
      check('配对后悬浮小人出现', fab && fab.hidden === false)
      check('空闲时不晃', fab.classList.contains('think') === false)
      D.applyEvent({ t: 'ev.run_state', sessionId: 'fish-1', state: 'running' })
      check('运行中会晃', fab.classList.contains('think') === true, 'state=' + D.fishState() + ' running=' + String(D.S.running['fish-1']))
      D.applyEvent({ t: 'ev.run_state', sessionId: 'fish-1', state: 'idle' })
      check('跑完恢复空闲', fab.classList.contains('think') === false)
      check('跑完先播 done 窗口', D.fishState() === 'done', D.fishState())
      D.S.fishDoneUntil = 0
      check('讲话窗口内切到 talk', (D.S.fishTalkUntil = Date.now() + 1500, D.fishState() === 'talk'), D.fishState())
      D.S.fishTalkUntil = 0
      check('讲话窗口过后回 idle', D.fishState() === 'idle', D.fishState())
      check('待机池至少 2 个动作', (D.FISH_POOLS.idle || []).length >= 2, String((D.FISH_POOLS.idle || []).length))
      check('干活池至少 2 个动作', (D.FISH_POOLS.think || []).length >= 2, String((D.FISH_POOLS.think || []).length))
      check('交付池至少 2 个动作', (D.FISH_POOLS.talk || []).length >= 2, String((D.FISH_POOLS.talk || []).length))
      D.S.fishPokeUntil = Date.now() + 1000
      check('点按后进入 poke', D.fishState() === 'poke', D.fishState())
      D.S.fishPokeUntil = 0
      D.S.fishDoneUntil = Date.now() + 1000
      check('跑完的 done 窗口', D.fishState() === 'done', D.fishState())
      D.S.fishDoneUntil = 0
      D.S.running['fish-1'] = true
      D.S.fishAnswerUntil = Date.now() + 1000
      check('运行中且刚收到回复 → talk', D.fishState() === 'talk', D.fishState())
      D.S.fishAnswerUntil = 0
      check('运行中没有回复 → think', D.fishState() === 'think', D.fishState())
      D.S.running['fish-1'] = false
      check('停下后回 idle', D.fishState() === 'idle', D.fishState())
      const fishBody = document.getElementById('fishBody')
      const down = new PointerEvent('pointerdown', { bubbles: true, clientX: 12, clientY: 12, pointerId: 7 })
      const up = new PointerEvent('pointerup', { bubbles: true, clientX: 12, clientY: 12, pointerId: 7 })
      fishBody.dispatchEvent(down)
      fishBody.dispatchEvent(up)
      check('点一下冒出小气泡', document.getElementById('fishBubble').hidden === false)
      check('气泡里写了状态', /气泡|戳|戳不|唔/.test(document.getElementById('fishBubble').textContent), document.getElementById('fishBubble').textContent)
      document.getElementById('fishBubble').hidden = true
      localStorage.removeItem('drc.fishPos')
      fishBody.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, clientX: 20, clientY: 20, pointerId: 8 }))
      fishBody.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: 120, clientY: 140, pointerId: 8 }))
      fishBody.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, clientX: 120, clientY: 140, pointerId: 8 }))
      const savedPos = localStorage.getItem('drc.fishPos')
      check('拖动后位置记下来', !!savedPos, String(savedPos))
      check('拖动后位置真的变了', (parseFloat(fab.style.left) || 0) > 20, fab.style.left)
      check('拖动不冒气泡', document.getElementById('fishBubble').hidden === true)
      setTimeout(() => {
        const img = document.getElementById('fishImg')
        const svg = document.querySelector('#fishBody .fishSvg')
        const sprite = document.getElementById('fishSprite')
        const spriteShown = !!(sprite && sprite.hidden === false)
        const imgShown = !!(img && !img.hidden && img.complete && img.naturalWidth > 0)
        const svgShown = !!(svg && svg.style.display !== 'none')
        // 序列帧 / 单张图 / 占位画，三层永远只显示一个
        check('形象层只显示一个（序列帧/图片/占位画）',
          (spriteShown ? 1 : 0) + (imgShown ? 1 : 0) + (svgShown ? 1 : 0) === 1,
          'sprite=' + spriteShown + ' img=' + imgShown + ' svg=' + svgShown)
        // 有图集时：确认真的把图集挂上了、还给了帧偏移（无图集时这层不出现，跳过）
        if (spriteShown) {
          check('序列帧挂的是 idle 图集', /dafeiyu_Idle\.webp/.test(sprite.style.backgroundImage || ''), sprite.style.backgroundImage)
          check('序列帧已有 background-position 偏移', /^-?\d+px -?\d+px$/.test(sprite.style.backgroundPosition || ''), sprite.style.backgroundPosition)
          check('序列帧在跑时占位画藏起来了', svg.style.display === 'none')
        }
      }, 400)
      // ---- 19. 序列帧驱动（纯函数）：帧率 / 回绕 / 图集偏移 ----
      const SP = D.FISH_SPRITES.idle
      check('图集网格与帧数对得上（8x6=48）', SP.cols * SP.rows === SP.frameCount, SP.cols + 'x' + SP.rows + '=' + SP.frameCount)
      check('0 毫秒是第 0 帧', D.fishFrameAt(0) === 0, String(D.fishFrameAt(0)))
      check('24fps 下 1000ms 是第 24 帧', D.fishFrameAt(1000) === 24, String(D.fishFrameAt(1000)))
      check('2 秒整回绕到第 0 帧', D.fishFrameAt(2000) === 0, String(D.fishFrameAt(2000)))
      check('回绕前一帧是第 47 帧', D.fishFrameAt(1999) === 47, String(D.fishFrameAt(1999)))
      const o0 = D.fishSpriteOffset(0), o9 = D.fishSpriteOffset(9), o47 = D.fishSpriteOffset(47)
      check('第 0 帧偏移是 (0,0)', o0.x === 0 && o0.y === 0, JSON.stringify(o0))
      check('第 9 帧换到第二行第二列', o9.x === -60 && o9.y === -80, JSON.stringify(o9))
      check('最后一帧在第八列第六行', o47.x === -420 && o47.y === -400, JSON.stringify(o47))
      check('序列帧元素在 DOM 里（id=fishSprite，图集到了就接管显示）', !!document.getElementById('fishSprite'))
      D.showView('pair')
      check('配对页不显示悬浮小人', document.getElementById('fishFab').hidden === true)
      // 异步看图自测还要接着用 a1，把当前会话还回去
      D.S.current = 'a1'

      // ---- 20. 历史翻页：第一页 200 条、游标、去重、按序拼到前面 ----
      // 用独立会话做，别把后面异步看图自测正在用的 a1 消息列表清掉
      const savedMsgs = D.S.msgs
      const savedCurrent = D.S.current
      const savedLoaded = D.S.historyLoaded
      D.S.current = 'hist-1'
      D.S.historyLoaded = false
      D.S.msgs = []
      D.S.nextBeforeSeq = undefined
      D.S.earlierBusy = false
      D.applyEvent({
        t: 'ev.session_history', sessionId: 'hist-1', cmdId: 'h0',
        items: [{ t: 'ev.message_delta', sessionId: 'hist-1', messageId: 'hm1', role: 'assistant', delta: '第一页正文' }],
        nextBeforeSeq: 90,
      })
      check('第一页到位', D.S.msgs.length === 1 && D.S.msgs[0].id === 'hm1', D.S.msgs.map(m => m.id).join(','))
      check('有更早时出现「加载更早」', document.getElementById('earlierWrap').hidden === false)
      check('游标记住了', D.S.nextBeforeSeq === 90, String(D.S.nextBeforeSeq))
      const hc = D.historyCmd('hist-1', 90)
      check('翻页命令带游标 + 200 条上限', hc.t === 'cmd.session_history' && hc.beforeSeq === 90 && hc.limit === 200, JSON.stringify({ beforeSeq: hc.beforeSeq, limit: hc.limit }))
      check('第一页请求不带 beforeSeq', D.historyCmd('hist-1').beforeSeq === undefined, String(D.historyCmd('hist-1').beforeSeq))
      check('每页条数就是 200', D.HISTORY_PAGE_LIMIT === 200, String(D.HISTORY_PAGE_LIMIT))
      D.S.earlierBusy = true
      D.applyEvent({
        t: 'ev.session_history', sessionId: 'hist-1', cmdId: 'h1',
        items: [
          { t: 'ev.message_delta', sessionId: 'hist-1', messageId: 'hm0', role: 'assistant', delta: '更早的一页' },
          { t: 'ev.message_delta', sessionId: 'hist-1', messageId: 'hm1', role: 'assistant', delta: '第一页正文' },
        ],
      })
      check('更早的页拼到消息列表前面', D.S.msgs[0] && D.S.msgs[0].id === 'hm0', D.S.msgs.map(m => m.id).join(','))
      check('翻页重叠的条目不会重复', D.S.msgs.filter(m => m.id === 'hm1').length === 1, String(D.S.msgs.length))
      check('到底了（没有游标）按钮藏起来', document.getElementById('earlierWrap').hidden === true && D.S.earlierBusy === false)
      // 切到别的会话时迟到的一页不许串台
      D.S.current = 'other-session'
      D.S.msgs = []
      D.applyEvent({ t: 'ev.session_history', sessionId: 'hist-1', cmdId: 'h2', items: [{ t: 'ev.message_delta', sessionId: 'hist-1', messageId: 'late', role: 'assistant', delta: '串台' }] })
      check('切了会话的迟到历史不串台', D.S.msgs.length === 0, String(D.S.msgs.length))
      // 还原 a1 的消息列表给后面异步看图自测用
      D.S.msgs = savedMsgs
      D.S.current = savedCurrent
      D.S.historyLoaded = savedLoaded
      D.S.nextBeforeSeq = undefined
      D.S.earlierBusy = false

      // ---- 21. 会话缓存：进会话先用本地快照，主机页回来后覆盖；排队中的气泡不被吞 ----
      D.S.msgs = []
      D.S.historyLoaded = false
      D.saveCache('cache-1', [{ id: 'c1', kind: 'msg', role: 'assistant', text: '缓存里的上一轮' }])
      const cachedBox = D.readCache('cache-1')
      check('缓存读得回来', !!cachedBox && cachedBox.msgs.length === 1 && cachedBox.msgs[0].id === 'c1', cachedBox ? String(cachedBox.msgs.length) : 'null')
      D.S.current = null
      D.openSession('cache-1', '缓存会话')
      check('进会话先显示缓存', D.S.msgs.length === 1 && D.S.msgs[0].text === '缓存里的上一轮', String(D.S.msgs.length))
      check('有缓存时不再显示「加载中…」', document.getElementById('messages').textContent.indexOf('加载中') < 0)
      D.S.msgs.push({ id: 'pend-1', kind: 'msg', role: 'user', text: '刚发出去的话', pending: true })
      D.applyEvent({ t: 'ev.session_history', sessionId: 'cache-1', cmdId: 'c0', items: [{ t: 'ev.message_delta', sessionId: 'cache-1', messageId: 's1', role: 'assistant', delta: '主机最新一页' }] })
      check('主机回页后以主机页为准', D.S.msgs.some(m => m.id === 's1') && D.S.msgs.length === 2, D.S.msgs.map(m => m.id).join(','))
      check('主机页不吞掉排队中的气泡', D.S.msgs.some(m => m.id === 'pend-1'))
      check('缓存按会话隔离', D.readCache('another-session') === null)

      // ---- 22. 运行状态条 + 停止键灰/亮 ----
      D.S.current = 'run-1'
      D.S.running = {}
      D.S.runStart = {}
      D.updateRunBanner()
      D.syncStopBtn()
      check('空闲时「停」是灰的', document.getElementById('stopBtn').disabled === true, String(document.getElementById('stopBtn').disabled))
      check('空闲时不显示运行条', document.getElementById('runBanner').hidden === true)
      D.applyEvent({ t: 'ev.run_state', sessionId: 'run-1', state: 'running' })
      check('运行中出现「深度求索中…」', document.getElementById('runBanner').hidden === false && textOf('runText').indexOf('深度求索中') >= 0, textOf('runText'))
      check('运行条带计时（m:ss）', /^深度求索中… \d+:\d\d$/.test(textOf('runText')), textOf('runText'))
      check('运行中「停」亮了', document.getElementById('stopBtn').disabled === false && document.getElementById('stopBtn').classList.contains('stopOn'))
      D.applyEvent({ t: 'ev.run_state', sessionId: 'run-1', state: 'idle' })
      check('跑完运行条收起', document.getElementById('runBanner').hidden === true)
      check('跑完「停」重新变灰', document.getElementById('stopBtn').disabled === true && !document.getElementById('stopBtn').classList.contains('stopOn'))
      // 还原给后面的用例
      D.S.msgs = savedMsgs
      D.S.current = savedCurrent
      D.S.historyLoaded = savedLoaded
      D.S.earlierBusy = false

      // ---- 23. 子代理监视器：名称/简述/活动/互斥时间/命名标黄/一键归档 ----
      D.S.current = 'sub-1'
      D.S.view = 'chat'
      // 面板开着才画列表；角标数字以最近一次回包为准（S.subCount），
      // 这里的"回包"就是手动塞进去的 subItems。
      D.S.subOpen = true
      D.S.subCount = 2
      D.S.subItems = [
        {
          id: 'c1', status: 'running', name: '渲染合批', summary: '升级 VFX 批次合并并跑通验收',
          activity: '运行 Bash', runningMs: 65000, idleMs: 1000, naming: 'ok', workMs: 65000,
        },
        {
          id: 'c2', status: 'idle', name: '没按格式写的名字', naming: 'fallback',
          task: '整理文档', workMs: 3600000, idleMs: 3 * 3600 * 1000,
        },
      ]
      D.renderSubPanel()
      check('有子代理时出现 🐝 图标', document.getElementById('subFab').hidden === false)
      check('角标显示子代理数量', document.getElementById('subCount').textContent === '2', document.getElementById('subCount').textContent)
      const subRows = document.querySelectorAll('#subList .subRow')
      check('列表渲染两行', subRows.length === 2)
      check('名称来自 label（不是整段 prompt）', subRows[0].textContent.indexOf('渲染合批') >= 0)
      check('简述显示在行里', subRows[0].textContent.indexOf('升级 VFX 批次合并并跑通验收') >= 0)
      check('运行中显示「运行」不显示「闲置」', /运行中 · 运行 1m05s/.test(subRows[0].textContent) && subRows[0].textContent.indexOf('闲置') < 0, subRows[0].textContent)
      check('显示「正在：运行 Bash」', subRows[0].textContent.indexOf('正在：运行 Bash') >= 0)
      check('未按格式的行标黄', subRows[1].querySelector('.subWarn') !== null)
      check('未命名行显示 子代理N', subRows[1].textContent.indexOf('子代理') >= 0, subRows[1].textContent)
      check('未按要求填写占位', subRows[1].textContent.indexOf('未按要求填写') >= 0, subRows[1].textContent)
      check('空闲行显示「闲置」', /空闲 · 闲置/.test(subRows[1].textContent), subRows[1].textContent)
      check('每行都有归档按钮（非运行中）', document.querySelectorAll('#subList .subActs button').length === 1)
      check('一键归档按钮显示闲置数量', document.getElementById('subArchiveIdle').hidden === false && document.getElementById('subArchiveIdle').textContent.indexOf('1') >= 0, document.getElementById('subArchiveIdle').textContent)
      // lite 回执（面板关着时的常态）：只更新角标数字，不碰已有的行
      D.S.subOpen = false
      D.S.subCmd = 'lite-cmd-1'
      D.S.subBusy = true
      D.applyEvent({ t: 'ev.result', ok: true, cmdId: 'lite-cmd-1', data: { lite: true, count: 5, running: 1 } })
      check('lite 回执只更新角标数字', D.S.subCount === 5 && D.S.subRunning === 1, D.S.subCount + '/' + D.S.subRunning)
      check('lite 回执不覆盖已有的行', D.S.subItems.length === 2, String(D.S.subItems.length))
      D.S.subOpen = true
      D.S.subCount = 2
      // 回执分流：ev.result 带 items 且 cmdId 匹配 → 落到子代理列表
      D.S.subCmd = 'sub-cmd-1'
      D.S.subBusy = true
      D.applyEvent({ t: 'ev.result', ok: true, cmdId: 'sub-cmd-1', data: { items: [{ id: 'c9', status: 'idle', name: '后来派的一个', idleMs: 2000 }] } })
      check('回执落到子代理列表（带 name 字段）', D.S.subItems.length === 1 && D.S.subItems[0].name === '后来派的一个', String(D.S.subItems.length))
      check('回执把请求标志清掉', D.S.subCmd === '' && D.S.subBusy === false)
      D.S.subItems = []
      D.S.subCount = 0
      D.renderSubPanel()
      check('没有子代理时图标藏起来', document.getElementById('subFab').hidden === true)
      check('没有闲置时一键归档按钮藏起来', document.getElementById('subArchiveIdle').hidden === true)
      D.S.subItems = [{ id: 'cx', status: 'running', name: 'x', runningMs: 1000, idleMs: 0 }]
      D.S.subCount = 1
      D.renderSubPanel()
      D.closeSubPanel()
      check('关闭面板后隐藏', document.getElementById('subPanel').hidden === true)
      D.S.current = savedCurrent
      D.S.view = 'chat'
      D.S.subItems = []
      D.S.subCount = 0

      // ---- 17. 倒计时走完才解锁，确认后才真的断开 ----
      D.el.gearBtn.click()
      D.el.repairBtn.click()
      setTimeout(() => {
        const ok = document.getElementById('cfOk')
        check('5 秒后确认键解锁', ok.disabled === false, String(ok.disabled))
        check('确认键文字变成「确定重新配对」', ok.textContent === '确定重新配对', ok.textContent)
        localStorage.setItem('drc.psk', 'keepme')
        ok.click()
        check('确认后回到配对页', document.getElementById('pairView').hidden === false)
        check('确认后清掉配对信息', localStorage.getItem('drc.psk') === null, String(localStorage.getItem('drc.psk')))
        finish()
      }, 5600)

      function finish() {
        dump()
        const fails = out.filter(r => !r.pass).length
        if (errs.length) {
          const d = document.createElement('div')
          d.className = 'bad'
          d.textContent = 'JS-ERRORS: ' + errs.join(' | ').slice(0, 300)
          document.getElementById('res').appendChild(d)
        }
        document.title = (fails || errs.length ? 'FAIL:' + (fails + errs.length) : 'PASS:' + out.length)
      }
    }, 60)
  })
</script>
</body>
</html>
